apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agy-gateway

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

images:
  - name: ghcr.io/sujoshua/agy-gateway
    newTag: edge

secretGenerator:
  - name: agy-gateway
    literals:
      # Comma-separated bearer keys for the API and the /login page.
      - AGY_GW_API_KEYS=change-me

configMapGenerator:
  - name: agy-gateway
    literals:
      - AGY_GW_IGNORE_UNSUPPORTED_PARAMS=true
      - AGY_GW_LOG_LEVEL=info
